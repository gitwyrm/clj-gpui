[package]
name = "clj-gpui"
version = "0.1.0"
edition = "2024"
description = "Native GPUI applications driven by real JVM Clojure"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
gpui-kit = { version = "0.6.0", features = ["tree-sitter-languages"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux/Windows window capture. 0.5+ needs libpipewire at compile time.
# 0.4.1 is X11/xcb + dbus on Linux (native Wayland windows are not
# reliably enumerated) and still skips the current Windows process in
# Window::all(), which is why those platforms spawn a helper.
[target.'cfg(not(target_os = "macos"))'.dependencies]
xcap = "=0.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
raw-window-handle = "0.6"
